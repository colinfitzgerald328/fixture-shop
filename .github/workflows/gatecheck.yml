name: gatecheck
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  gatecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: colinfitzgerald328/gatecheck@main
        with:
          test-command: node --test 'api/test/**/*.test.ts'
